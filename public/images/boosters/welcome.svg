<svg xmlns="http://www.w3.org/2000/svg" width="600" height="880" viewBox="0 0 600 880" role="img" aria-labelledby="title desc">
  <title id="title">Apex Collector - Booster de bienvenue</title>
  <desc id="desc">Booster exclusif bleu nuit, cuivré et doré, édition bienvenue contenant dix cartes.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101c31"/>
      <stop offset=".48" stop-color="#07111f"/>
      <stop offset="1" stop-color="#25172c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".6">
      <stop stop-color="#fff7ce"/>
      <stop offset=".3" stop-color="#f3c679"/>
      <stop offset=".7" stop-color="#d98653"/>
      <stop offset="1" stop-color="#fff1b4"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd38c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d75559" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a5b1c5" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-17)">
      <rect width="20" height="20" fill="#f8cf8c" opacity=".14"/>
      <rect x="20" y="20" width="20" height="20" fill="#f8cf8c" opacity=".14"/>
    </pattern>
  </defs>
  <rect width="600" height="880" rx="28" fill="url(#base)"/>
  <rect width="600" height="880" rx="28" fill="url(#grid)"/>
  <path d="M0 0H600V225L0 478Z" fill="url(#flare)"/>
  <path d="M0 598L600 325V510L0 775Z" fill="#f5b973" fill-opacity=".045"/>
  <path d="M-50 678L650 362" stroke="#f5b973" stroke-opacity=".28" stroke-width="3"/>
  <path d="M-50 715L650 399" stroke="#f5b973" stroke-opacity=".13" stroke-width="18"/>
  <path d="M0 0H600V42H0Z" fill="#0c1425"/>
  <path d="M0 838H600V880H0Z" fill="#0c1425"/>
  <rect x="23" y="23" width="554" height="834" rx="12" fill="none" stroke="url(#gold)" stroke-opacity=".8" stroke-width="3"/>
  <rect x="35" y="35" width="530" height="810" rx="8" fill="none" stroke="#e0bb83" stroke-opacity=".18" stroke-width="1"/>
  <path d="M65 105H535" stroke="url(#gold)" stroke-opacity=".65" stroke-width="2"/>
  <text x="300" y="85" fill="#f3d5a0" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="25" letter-spacing="8" text-anchor="middle">APEX COLLECTOR</text>
  <path d="M174 378L300 162L426 378H382L300 239L218 378Z" fill="url(#gold)"/>
  <path d="M237 350H363L343 384H257Z" fill="#f8dab1"/>
  <path d="M136 427Q300 477 464 427" fill="none" stroke="url(#gold)" stroke-opacity=".55" stroke-width="5"/>
  <path d="M120 445Q300 503 480 445" fill="none" stroke="#e4b878" stroke-opacity=".20" stroke-width="2"/>
  <text x="300" y="535" fill="#fff9e9" font-family="Arial,Helvetica,sans-serif" font-size="59" font-weight="900" letter-spacing="3" text-anchor="middle">BIENVENUE</text>
  <text x="300" y="587" fill="#e8b878" font-family="Arial,Helvetica,sans-serif" font-size="25" letter-spacing="11" text-anchor="middle">EDITION</text>
  <rect x="87" y="635" width="426" height="2" fill="url(#gold)" opacity=".56"/>
  <rect x="164" y="677" width="272" height="98" rx="16" fill="#f4c988" fill-opacity=".08" stroke="#ecc386" stroke-opacity=".8" stroke-width="2"/>
  <text x="300" y="729" fill="#fff7e2" font-family="Arial,Helvetica,sans-serif" font-size="47" font-weight="900" text-anchor="middle">10 CARTES</text>
  <text x="300" y="752" fill="#ecca91" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="4" text-anchor="middle">OFFERT UNE SEULE FOIS</text>
  <rect x="65" y="798" width="470" height="21" fill="url(#checker)"/>
